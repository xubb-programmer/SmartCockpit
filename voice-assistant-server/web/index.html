<!DOCTYPE html>

    <title>智能控制中心</title>
    <link rel="stylesheet" href="css/style.css?v=0814a">
    <script>
        // 检测是否使用file://协议打开
        if (window.location.protocol === 'file:') {
            document.addEventListener('DOMContentLoaded', function () {
                // 创建背景模糊遮罩
                const overlayDiv = document.createElement('div');
                overlayDiv.className = 'file-protocol-overlay';
                document.body.appendChild(overlayDiv);

                // 创建警告框
                const warningDiv = document.createElement('div');
                warningDiv.id = 'fileProtocolWarning';
                warningDiv.innerHTML = `
                    <h2>⚠️ 警告：请使用HTTP服务器打开此页面</h2>
                    <p>您当前使用的是本地文件方式打开页面（file://协议），这可能导致页面功能异常。</p>
                    <p>您可以使用nginx映射启动页面，也可以按照以下步骤使用python启动HTTP服务：</p>
                    <ol>
                        <li>打开命令行终端</li>
                        <li>命令行进入到 voice-assistant-server/web 目录</li>
                        <li>执行以下命令启动HTTP服务器：</li>
                    </ol>
                    <pre>python -m http.server 18006</pre>
                    <p>然后在浏览器中访问：<strong>http://localhost:18006/</strong></p>
                `;
                document.body.appendChild(warningDiv);
            });
        }
    </script>
</head>

    <!-- 全局错误处理 -->
    <script>
        // 添加全局错误处理
        window.addEventListener('error', function (event) {
            console.error('全局错误:', event.error);
        });

        // 添加未处理的Promise拒绝处理
        window.addEventListener('unhandledrejection', function (event) {
            console.error('未处理的Promise拒绝:', event.reason);
        });
    </script>

    <script>
    // ── 车型选择器 ──────────────────────────────────────────────────
    (function () {
        function getApiBase() {
            const ota = document.getElementById('otaUrl')?.value || '';
            // 从 OTA 地址推断 API 地址：http://host:port/...  → http://host:port
            try { return new URL(ota).origin; } catch (e) { return ''; }
        }

        async function loadProfiles() {
            const base = getApiBase();
            if (!base) return;
            const sel = document.getElementById('vehicleProfileSelect');
            const msg = document.getElementById('vehicleSwitchMsg');
            try {
                const res = await fetch(`${base}/voice_assistant/vehicle/profiles`);
                const data = await res.json();
                sel.replaceChildren();
                (data.profiles || []).forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name + (p.active ? ' ✓' : '');
                    opt.selected = p.active;
                    sel.appendChild(opt);
                });
                if (msg) msg.textContent = `当前: ${data.current || '未设置'}`;
            } catch (e) {
                if (sel) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = '-- 无法连接服务器 --';
                    sel.replaceChildren(opt);
                }
            }
        }

        async function switchProfile() {
            const base = getApiBase();
            const sel = document.getElementById('vehicleProfileSelect');
            const msg = document.getElementById('vehicleSwitchMsg');
            const profileId = sel?.value;
            if (!base || !profileId) return;

            msg.textContent = '切换中...';
            msg.style.color = '#aaa';
            try {
                const res = await fetch(`${base}/voice_assistant/vehicle/switch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profile_id: profileId }),
                });
                const data = await res.json();
                if (data.success) {
                    msg.textContent = `✅ 已切换为 ${profileId}，下次连接生效`;
                    msg.style.color = '#4caf50';
                    await loadProfiles(); // 刷新列表
                } else {
                    msg.textContent = `❌ 切换失败: ${data.error || '未知错误'}`;
                    msg.style.color = '#f44336';
                }
            } catch (e) {
                msg.textContent = `❌ 请求失败: ${e.message}`;
                msg.style.color = '#f44336';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 打开设置弹窗时加载车型列表
            document.getElementById('settingsBtn')?.addEventListener('click', () => {
                setTimeout(loadProfiles, 200); // 等弹窗动画完成
            });
            // 切换按钮
            document.getElementById('switchVehicleBtn')?.addEventListener('click', switchProfile);
        });
    })();
    </script>

    <!-- 帮助弹窗 -->
    <div class="modal" id="helpModal">
        <div class="modal-content help-modal">
            <div class="modal-header">
                <h2 id="helpModalTitle">语音指令帮助</h2>
                <button class="close-btn" id="closeHelpBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="helpCommandsContainer" class="help-commands-container">
                    <div class="help-loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ── 帮助弹窗 ──────────────────────────────────────────────────
    (function () {
        function setHelpMessage(container, className, text) {
            const message = document.createElement('div');
            message.className = className;
            message.textContent = text;
            container.replaceChildren(message);
        }

        function getApiBase() {
            const ota = document.getElementById('otaUrl')?.value || '';
            try { return new URL(ota).origin; } catch (e) { return ''; }
        }

        async function loadCommands() {
            const base = getApiBase();
            const container = document.getElementById('helpCommandsContainer');
            if (!base) {
                setHelpMessage(container, 'help-empty', '请先配置 OTA 服务器地址');
                return;
            }
            setHelpMessage(container, 'help-loading', '加载中...');

            try {
                const res = await fetch(`${base}/voice_assistant/vehicle/commands`);
                const data = await res.json();
                if (data.error) {
                    setHelpMessage(container, 'help-empty', `❌ ${data.error}`);
                    return;
                }

                // 更新标题
                const title = document.getElementById('helpModalTitle');
                if (title) title.textContent = `${data.vehicle_name} · 语音指令`;

                // 渲染指令列表
                const fragment = document.createDocumentFragment();
                (data.commands || []).forEach(group => {
                    const category = document.createElement('div');
                    category.className = 'help-category';

                    const header = document.createElement('div');
                    header.className = 'help-category-header';
                    header.textContent = `${group.icon || ''} ${group.category || ''}`.trim();
                    category.appendChild(header);

                    const grid = document.createElement('div');
                    grid.className = 'help-cmd-grid';
                    (group.items || []).forEach(item => {
                        const text = String(item.text ?? '');
                        const description = String(item.description ?? '');

                        const button = document.createElement('button');
                        button.className = 'help-cmd-btn';
                        button.dataset.cmd = text;
                        button.title = description;
                        button.addEventListener('click', () => sendCommand(text));

                        const textSpan = document.createElement('span');
                        textSpan.className = 'help-cmd-text';
                        textSpan.textContent = text;

                        const descSpan = document.createElement('span');
                        descSpan.className = 'help-cmd-desc';
                        descSpan.textContent = description;

                        button.append(textSpan, descSpan);
                        grid.appendChild(button);
                    });
                    category.appendChild(grid);
                    fragment.appendChild(category);
                });
                container.replaceChildren(fragment);
            } catch (e) {
                setHelpMessage(container, 'help-empty', '❌ 无法连接服务器');
            }
        }

        function sendCommand(text) {
            // 使用 WebSocket 发送文本消息（模拟语音输入）
            const { getWebSocketHandler } = window._helpModules || {};
            if (getWebSocketHandler) {
                const ws = getWebSocketHandler();
                if (ws && ws.isConnected()) {
                    ws.sendTextMessage(text);
                    // 关闭弹窗
                    document.getElementById('helpModal').style.display = 'none';
                    return;
                }
            }
            // 降级：写入聊天输入框
            const input = document.getElementById('messageInput');
            if (input) {
                input.value = text;
                input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
            }
            document.getElementById('helpModal').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const helpBtn = document.getElementById('helpBtn');
            const helpModal = document.getElementById('helpModal');
            const closeBtn = document.getElementById('closeHelpBtn');

            helpBtn?.addEventListener('click', () => {
                helpModal.style.display = 'flex';
                loadCommands();
            });
            closeBtn?.addEventListener('click', () => {
                helpModal.style.display = 'none';
            });
            helpModal?.addEventListener('click', (e) => {
                if (e.target === helpModal) helpModal.style.display = 'none';
            });
        });

        // 暴露模块注入接口
        window._helpModules = window._helpModules || {};
    })();
    </script>

</body>

</html>
